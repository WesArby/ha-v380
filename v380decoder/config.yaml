name: V380 Decoder
version: 0.5.1
slug: v380decoder
description: V380 camera LAN-protocol proxy (RTSP + ONVIF + snapshot + REST API)
url: https://github.com/felipemarques/camera-v380decoder
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ports:
  8554/tcp: 8554
  8080/tcp: 8080
ports_description:
  8554/tcp: RTSP live stream (rtsp://<ha-ip>:8554/live)
  8080/tcp: HTTP snapshot, Web UI, REST API and ONVIF
options:
  device_id: 12345678
  username: admin
  password: ""
  camera_ip: 192.168.1.100
  camera_port: 8800
  quality: hd
  enable_api: true
  enable_onvif: true
schema:
  device_id: int
  username: str
  password: password
  camera_ip: ipv4
  camera_port: port
  quality: list(hd|sd)
  enable_api: bool
  enable_onvif: bool
